name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/myapp-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/myapp-frontend
  NAMESPACE: myapp

jobs:
  build-and-deploy:
    runs-on: self-hosted
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    
    - name: Build and push Backend
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}, ${{ env.BACKEND_IMAGE }}:latest
    
    - name: Build and push Frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}, ${{ env.FRONTEND_IMAGE }}:latest
    
    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/backend backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} -n ${{ env.NAMESPACE }}
        kubectl set image deployment/frontend frontend=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} -n ${{ env.NAMESPACE }}
        kubectl rollout status deployment/backend -n ${{ env.NAMESPACE }} --timeout=60s
        kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=60s